services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fsae_inventory
      POSTGRES_USER: fsae
      POSTGRES_PASSWORD: fsae_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsae -d fsae_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://fsae:fsae_dev_password@db:5432/fsae_inventory
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
